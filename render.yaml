services:
  - type: web
    name: rns-update
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Fixed values for sending via SendGrid's SMTP relay - filled in
      # already so you only need to set the two secrets below in the Render
      # dashboard. SMTP_USER is always the literal string "apikey" for
      # SendGrid (not a placeholder - that's genuinely the username SendGrid
      # expects; the real secret is the API key in SMTP_PASS). See the
      # "Email notifications" section in README.md for full setup steps
      # (account signup, sender verification, creating the API key).
      - key: SMTP_HOST
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: apikey
      # sync: false means Render will prompt for these in the dashboard
      # instead of reading a value from this file - so the real API key and
      # sender address are never committed to the repo.
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_EMAIL_FROM
        sync: false
