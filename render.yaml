services:
  - type: web
    name: rns-update
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Sends via the Resend API (see README.md's "Email notifications"
      # section for signup/verification/API-key steps). Entirely optional -
      # the app runs fine with neither set, just without the "Send
      # Notification" button working. sync: false means Render prompts for
      # these in the dashboard instead of reading a value from this file -
      # so the real API key and sender address are never committed here.
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL_FROM
        sync: false
