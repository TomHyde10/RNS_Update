services:
  - type: web
    name: rns-update
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Sends via the Resend API (see README.md's "Email notifications"
      # section for signup/verification/API-key steps). Entirely optional -
      # the app runs fine with neither set, just without the "Send
      # Notification" button working. sync: false means Render prompts for
      # these in the dashboard instead of reading a value from this file -
      # so the real API key and sender address are never committed here.
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL_FROM
        sync: false
      # Encrypts shareable links and the RSS feed URL (see README.md's
      # "Encrypted view links"). generateValue has Render create a random
      # secret once, so nothing sensitive is committed here either.
      - key: VIEW_TOKEN_SECRET
        generateValue: true
      # Real Web Push notifications (see README.md's "Push notifications"
      # section) - sync: false rather than generateValue, since these two
      # must be a matched key pair from `npx web-push generate-vapid-keys`,
      # not independently generated random strings. Optional - without
      # both set, the "Push" button in the header never appears.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Backs the NSM result cache (lib/cacheStore.js), automatic email
      # digest subscriptions (lib/subscriptionStore.js), the shared company
      # watchlist (lib/watchlistStore.js), and which reports have already
      # been seen (lib/seenStore.js) - the latter three need this database
      # to exist at all: a subscription has to survive process restarts to
      # mean anything as "automatic", and a watchlist/seen-state edit has
      # to survive them (and work from any browser/device) to be genuinely
      # permanent rather than trapped in one browser's localStorage. Wired
      # automatically from the database block below.
      - key: DATABASE_URL
        fromDatabase:
          name: rns-update-db
          property: connectionString

databases:
  - name: rns-update-db
    plan: free
    databaseName: rns_update
    user: rns_update
