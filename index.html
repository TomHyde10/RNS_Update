<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RNS Update</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>RNS Update</h1>
    <p>Half-year and annual reports from the last week, for the companies below — sourced directly from the FCA's National Storage Mechanism, no API key required.</p>
  </header>

  <main>
    <section id="watchlist-manager">
      <h2>Companies</h2>
      <form id="add-company-form">
        <input id="lei-input" type="text" placeholder="LEI e.g. 549300UC0QPP7Y0W8056" maxlength="20" autocomplete="off" required />
        <input id="name-input" type="text" placeholder="Display name (optional)" autocomplete="off" />
        <button type="submit">Add</button>
      </form>
      <p id="lei-error" class="error" hidden></p>
      <ul id="company-list"></ul>
    </section>

    <div id="reports-header">
      <p id="status">Loading…</p>
      <button id="refresh">Refresh</button>
    </div>
    <ul id="reports"></ul>

    <details>
      <summary>All items returned this week (matched or not) — for diagnosing a missing report</summary>
      <pre id="debug"></pre>
    </details>
  </main>

  <script src="app.js"></script>
</body>
</html>
