<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RNS Update</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>RNS Update</h1>
    <p>Half-year and annual reports from the last week, for the companies below.</p>
  </header>

  <main>
    <section id="watchlist-manager">
      <h2>Companies</h2>
      <form id="add-company-form">
        <input id="isin-input" type="text" placeholder="ISIN e.g. GB00BK1PKQ95" maxlength="12" autocomplete="off" required />
        <input id="name-input" type="text" placeholder="Display name (optional)" autocomplete="off" />
        <button type="submit">Add</button>
      </form>
      <p id="isin-error" class="error" hidden></p>
      <ul id="company-list"></ul>
    </section>

    <div id="reports-header">
      <p id="status">Loading…</p>
      <button id="refresh">Refresh</button>
    </div>
    <ul id="reports"></ul>

    <details>
      <summary>Raw JSON (first report) — for checking API field names</summary>
      <pre id="debug"></pre>
    </details>
  </main>

  <script src="app.js"></script>
</body>
</html>
